name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # -n 2, not -n auto: GitHub-hosted runners get oversubscribed running
        # 4+ real headless Chrome instances concurrently, which starves each
        # browser's JS execution enough that even generous explicit waits
        # time out. 2 workers is well within the runner's actual headroom.
        run: pytest -n 2
        env:
          HEADLESS: "true"

      - name: Upload results.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/results.json

      - name: Publish results to QA dashboard
        if: always()
        run: |
          status=$(curl -s -o /tmp/webhook_response.json -w "%{http_code}" -X POST \
            "https://qa.zanuar.dev/api/results/selenium-python" \
            -H "Authorization: Bearer ${{ secrets.QA_DASHBOARD_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data @results/results.json)
          echo "webhook responded HTTP $status:"
          cat /tmp/webhook_response.json
          if [ "$status" != "200" ]; then
            echo "::warning::failed to publish results to qa.zanuar.dev (HTTP $status), dashboard may be stale"
          fi
